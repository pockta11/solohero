name: Get Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.62f3-base-3
    steps:
      - name: Generate activation file
        run: |
          unity-editor -batchmode -createManualActivationFile -logfile /tmp/unity.log || true
          cat /tmp/unity.log || true

      - name: Find and upload alf file
        uses: actions/upload-artifact@v4
        with:
          name: activation-file
          path: /root/*.alf
          if-no-files-found: warn
