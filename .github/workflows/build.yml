name: Unity Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. 러너 디스크 확보 — unityci/editor android 이미지(6.6 GB) pull 중 ENOSPC 방지
      #    기본 ubuntu-latest 러너는 여유가 ~14 GB뿐이라 사전 설치된 .NET/Android SDK/Haskell/CodeQL을 제거한다
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup                       /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h / | tail -1

      # 3. Library 캐시 (빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      # 4. Unity 빌드 실행 (GameCI)
      - name: Build Android AAB
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: BuildAutomator.Build
          androidExportType: androidAppBundle

      # 5. AAB 파일 저장 (7일 보관)
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: |
            build/Android/*.aab
            Builds/*.aab
          if-no-files-found: error
          retention-days: 7
