name: Unity Android Build

on:
  push:
    # ci/** = verification branches: tests, regenerated UI scenes committed back, AAB (no local Unity needed).
    branches: [ main, 'ci/**' ]
    paths-ignore:
      - '**.md'
      - '_bmad-output/**'
      - 'docs/**'
      - 'tools/**'
      - '.claude/**'
      - '_bmad/**'
  workflow_dispatch:  # manual trigger

# One Personal seat per account: never run two activations at once. Queue, don't cancel.
concurrency:
  group: unity-android-build
  cancel-in-progress: false

env:
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.62f3-android-3

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # ci/** only: push the regenerated scenes back to the branch
    env:
      # EditMode tests on every build; the UI scenes are rebuilt only on ci/** branches.
      SOLOHERO_CI_TESTS: '1'
      SOLOHERO_CI_REBUILD_UI: ${{ startsWith(github.ref_name, 'ci/') && '1' || '' }}

    steps:
      # 1. Checkout (Firebase editor binaries are in LFS)
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true

      # 2. Free runner disk - the unityci android image is 6.6 GB and the default runner has ~14 GB free.
      #    Remove preinstalled .NET / Android SDK / Haskell / CodeQL we do not use.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h / | tail -1

      # 3. Library cache
      - name: Cache Library
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      # 4. Unity build - unityci image run directly (no game-ci/unity-builder).
      #    Personal licenses can no longer be activated with a .ulf, so unity-build.sh asks the
      #    Licensing Client for a seat with email/password and returns it afterwards.
      #    Secrets: UNITY_EMAIL, UNITY_PASSWORD (UNITY_LICENSE is no longer used).
      #    --init makes SIGTERM on cancel reach the script so the seat is still returned.
      - name: Build Android AAB
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          chmod +x .github/scripts/unity-build.sh
          docker run --rm --init \
            -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD -e SOLOHERO_DEV_BUILD -e SOLOHERO_CI_TESTS -e SOLOHERO_CI_REBUILD_UI \
            -e SOLOHERO_VERSION_CODE="${{ github.run_number }}" \
            "$UNITY_IMAGE" \
            bash /project/.github/scripts/unity-build.sh

      # 5. Docker wrote as root; hand files back to the runner user so cache/artifact steps work even after a failed build
      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" Library Builds 2>/dev/null || true

      # 6. Test results and (ci/**) the regenerated scenes, also when the build failed
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: editmode-results
          path: Builds/ci/editmode.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit regenerated UI scenes
        if: success() && env.SOLOHERO_CI_REBUILD_UI == '1'
        run: |
          # Unity ran as root in the container: give the files back before git touches them.
          sudo chown -R "$(id -u):$(id -g)" Assets ProjectSettings Packages 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git add Assets/SoloHero/Scenes
          if git diff --cached --quiet; then
            echo "scenes unchanged"
          else
            git commit -m "ci: regenerate UI scenes (GameUiBuilder.BuildBatch) [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # 7. Keep the AAB for 7 days
      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: Builds/*.aab
          if-no-files-found: error
          retention-days: 7
