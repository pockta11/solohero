name: Unity Android Build

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '_bmad-output/**'
      - 'docs/**'
      - 'tools/**'
      - '.claude/**'
      - '_bmad/**'
  workflow_dispatch:  # manual trigger

# One Personal seat per account: never run two activations at once. Queue, don't cancel.
concurrency:
  group: unity-android-build
  cancel-in-progress: false

env:
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.62f3-android-3

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout (Firebase editor binaries are in LFS)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Free runner disk - the unityci android image is 6.6 GB and the default runner has ~14 GB free.
      #    Remove preinstalled .NET / Android SDK / Haskell / CodeQL we do not use.
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h / | tail -1

      # 3. Library cache
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      # 4. Unity build - unityci image run directly (no game-ci/unity-builder).
      #    Personal licenses can no longer be activated with a .ulf, so unity-build.sh asks the
      #    Licensing Client for a seat with email/password and returns it afterwards.
      #    Secrets: UNITY_EMAIL, UNITY_PASSWORD (UNITY_LICENSE is no longer used).
      #    --init makes SIGTERM on cancel reach the script so the seat is still returned.
      - name: Build Android AAB
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          chmod +x .github/scripts/unity-build.sh
          docker run --rm --init \
            -v "$GITHUB_WORKSPACE:/project" -w /project \
            -e UNITY_EMAIL -e UNITY_PASSWORD -e SOLOHERO_DEV_BUILD \
            "$UNITY_IMAGE" \
            bash /project/.github/scripts/unity-build.sh

      # 5. Docker wrote as root; hand files back to the runner user so cache/artifact steps work even after a failed build
      - name: Fix ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" Library Builds 2>/dev/null || true

      # 6. Keep the AAB for 7 days
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: Builds/*.aab
          if-no-files-found: error
          retention-days: 7
