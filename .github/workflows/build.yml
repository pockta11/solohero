name: Unity Android Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build Android AAB
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android
          restore-keys: Library-

      - name: Build
        run: |
          & "C:\Program Files\Unity\Hub\Editor\2022.3.62f3\Editor\Unity.exe" -quit -batchmode -projectPath "$env:GITHUB_WORKSPACE" -executeMethod BuildAutomator.Build -logFile Builds/build.log
        shell: pwsh

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: game-aab
          path: build/Android
